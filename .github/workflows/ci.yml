name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: olist_test
          POSTGRES_USER: etl_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U etl_user -d olist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://etl_user:ci_test_password@127.0.0.1:5432/olist_test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -q -rs
