services:
  postgres:
    image: postgres:17-alpine
    container_name: csv-etl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ไฟล์ SQL ในโฟลเดอร์นี้จะรันตอนสร้าง database ครั้งแรก
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d olist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: